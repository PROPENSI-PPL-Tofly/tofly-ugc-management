name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # allows the manual deploy job below to be triggered by hand

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Placeholder: runs only on a manual "Run workflow" (workflow_dispatch), never on push/PR.
  # Wire up a real host (Vercel, Railway, a VPS, etc.) inside the steps below when ready.
  deploy:
    name: Deploy (placeholder)
    needs: [frontend, backend]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy placeholder — no target configured yet. Add deploy steps here."
