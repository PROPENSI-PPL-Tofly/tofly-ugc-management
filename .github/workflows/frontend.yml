name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    # Only one test run per branch at a time; a newer push cancels the
    # superseded run. Scoped to this job so it never cancels a deploy.
    concurrency:
      group: frontend-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch head (not the PR merge ref) so the coverage
          # badge commit below can be pushed back to the source branch.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build

      - name: Generate coverage badge
        working-directory: ${{ github.workspace }}
        run: node scripts/coverage-badge.mjs frontend/coverage/coverage-summary.json .github/badges/frontend-coverage.svg

      # Commit the badge on push to main, or on an internal (same-repo) PR back to
      # its source branch. Fork PRs are skipped (no write access to the fork).
      - name: Commit coverage badge
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git add .github/badges/frontend-coverage.svg
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          # [skip ci] stops the badge commit from re-triggering this workflow.
          git commit -m "chore: update frontend coverage badge [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "badge push failed after retries; skipping"

  # Runs only on push/merge to main (after test passes). Builds the image, pushes
  # it to Artifact Registry, and rolls it out to Cloud Run.
  deploy:
    name: Deploy to Cloud Run
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that Workload Identity Federation exchanges for GCP
      # credentials. Without it, auth fails with a confusing 403.
      id-token: write
    concurrency:
      group: frontend-deploy-main
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Tagged with both the SHA and latest: the SHA tag is what makes a
      # rollback a one-liner against a known revision.
      - name: Build and push
        working-directory: frontend
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # BACKEND_URL is a runtime env var, not NEXT_PUBLIC_*, so the proxy route
      # reads it per request and the URL can change without a rebuild.
      - name: Deploy
        run: |
          gcloud run deploy frontend \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "run-frontend@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "BACKEND_URL=${{ vars.BACKEND_URL }}" \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 --cpu-boost --concurrency 80 \
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES }}" --max-instances 3
