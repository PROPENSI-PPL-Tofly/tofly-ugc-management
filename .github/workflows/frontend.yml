name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build

  # Placeholder: runs only on a manual "Run workflow" (workflow_dispatch), never on push/PR.
  # Wire up a real host (Vercel, a VPS, etc.) inside the steps below when ready.
  deploy:
    name: Deploy (placeholder)
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend deploy placeholder — no target configured yet. Add deploy steps here."
