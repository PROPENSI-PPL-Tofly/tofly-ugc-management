name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    # Only one test run per branch at a time; a newer push cancels the
    # superseded run. Scoped to this job so it never cancels a deploy.
    concurrency:
      group: backend-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch head (not the PR merge ref) so the coverage
          # badge commit below can be pushed back to the source branch.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run test:cov
      # Build the schema into the throwaway CI Postgres so e2e has real tables.
      # No-op while the schema has no models; starts creating tables once it does.
      - run: npx prisma db push --skip-generate
      - run: npm run test:e2e
      - run: npm run build

      - name: Generate coverage badge
        working-directory: ${{ github.workspace }}
        run: node scripts/coverage-badge.mjs backend/coverage/coverage-summary.json .github/badges/backend-coverage.svg

      # Commit the badge on push to main, or on an internal (same-repo) PR back to
      # its source branch. Fork PRs are skipped (no write access to the fork).
      - name: Commit coverage badge
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git add .github/badges/backend-coverage.svg
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          # [skip ci] stops the badge commit from re-triggering this workflow.
          git commit -m "chore: update backend coverage badge [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "badge push failed after retries; skipping"

  # Build first, migrate second, deploy third. Migrations are the only step here
  # that cannot be undone by re-running the pipeline, so nothing irreversible
  # happens until a deployable image already exists in Artifact Registry. A
  # broken Dockerfile then fails before the database is touched, instead of
  # leaving production migrated but still serving the old revision.
  build:
    name: Build and push image
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that Workload Identity Federation exchanges for GCP
      # credentials. Without it, auth fails with a confusing 403.
      id-token: write
    concurrency:
      group: backend-build-main
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/backend
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Tagged with both the SHA and latest: the SHA tag is what makes a
      # rollback a one-liner against a known revision.
      - name: Build and push
        working-directory: backend
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Applies Supabase migrations to the hosted database before the new revision
  # serves. backend/Dockerfile bakes the generated Prisma client into the image,
  # so code must never reach production ahead of the schema it expects.
  migrate:
    name: Apply Supabase migrations
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: backend-migrate-main
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      # A no-op while supabase/migrations/ is empty ("Remote database is up to
      # date"), which is exactly the point: it proves the credentials work
      # before a real migration depends on them.
      - run: supabase db push

  # Rolls the already-pushed image out to Cloud Run. needs migrate, so a failed
  # migration blocks the rollout.
  deploy:
    name: Deploy to Cloud Run
    needs: [build, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-deploy-main
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/backend
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # DB URLs come from Secret Manager, never --set-env-vars: env vars are
      # readable in the Cloud Run console and in deploy logs.
      - name: Deploy
        run: |
          gcloud run deploy backend \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "run-backend@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest" \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 --cpu-boost --concurrency 80 \
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES }}" --max-instances 3
