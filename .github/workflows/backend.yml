name: Backend CI

on:
  push:
    # feat/pbi-* are the per-PBI integration branches: subtask PRs land on one
    # of them, the PBI goes into staging, and staging goes into main. Only
    # staging and main deploy (to the staging and production environments);
    # feat/pbi-* only widens test coverage. `*` does not cross `/`, so a branch
    # that nests another segment would need `feat/pbi-**`.
    branches: [main, staging, "feat/pbi-*"]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, staging, "feat/pbi-*"]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    # Only one test run per branch at a time; a newer push cancels the
    # superseded run. Scoped to this job so it never cancels a deploy.
    concurrency:
      group: backend-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    services:
      postgres:
        # The same major as Cloud SQL (staging, production) and compose.yaml
        # (local dev). Plain Postgres on purpose: it has none of the roles a
        # managed platform adds, so a migration that leans on one fails here.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The app connects as its own role, which owns the tables after the
      # hand-off below, exactly as in staging and production. Migrations run as
      # postgres (MIGRATOR_DB_URL), as they do there.
      DATABASE_URL: postgresql://tofly_app:tofly_app@localhost:5432/postgres
      DIRECT_URL: postgresql://tofly_app:tofly_app@localhost:5432/postgres
      MIGRATOR_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch head (not the PR merge ref) so the coverage
          # badge commit below can be pushed back to the source branch.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run test:cov
      # Handed to the sonar job. coverage/ is git-ignored and never leaves the
      # runner otherwise. Uploaded before e2e/build so a later failure still
      # leaves the report available for debugging.
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 1
      # The same SQL, tool and order the migrate job runs against Cloud SQL, so a
      # migration that fails does so here, not during a deploy. tofly_app gets
      # anon and authenticated only so the e2e suites can `set role` to them and
      # prove those roles still reach nothing.
      - name: Prepare the CI database
        run: |
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 -f prisma/ops/bootstrap-roles.sql
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -c "create role tofly_app login password 'tofly_app'" \
            -c "grant anon, authenticated to tofly_app"
          DATABASE_URL="$MIGRATOR_DB_URL" DIRECT_URL="$MIGRATOR_DB_URL" npx prisma migrate deploy
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 -v app_role=tofly_app \
            -f prisma/ops/hand-off-ownership.sql
      - run: npm run test:e2e
      - run: npm run build

      - name: Generate coverage badge
        working-directory: ${{ github.workspace }}
        run: node scripts/coverage-badge.mjs backend/coverage/coverage-summary.json .github/badges/backend-coverage.svg

      # Only main moves the badge, so the SVG in the README always describes main
      # rather than whichever branch happened to run last. PR runs still generate
      # the badge above, so a broken generator fails here and not first on main.
      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git add .github/badges/backend-coverage.svg
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          # [skip ci] stops the badge commit from re-triggering this workflow.
          git commit -m "chore: update backend coverage badge [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "badge push failed after retries; skipping"

  # Static analysis + coverage on SonarCloud. sonar.qualitygate.wait turns a
  # failed quality gate into a failed job, which build (and so migrate and
  # deploy) `needs`. Skipped on fork PRs: SONAR_TOKEN is not exposed to them.
  sonar:
    name: SonarCloud analysis
    needs: [test]
    # PR analysis and main branch analysis only. A push to any other branch asks
    # SonarCloud for a branch analysis it refuses ("Not authorized or project not
    # found"), which would turn every merge into an integration branch red for a
    # reason no change here can fix. That includes staging: its code already
    # passed the gate in the PR that brought it there. Fork PRs stay excluded:
    # SONAR_TOKEN is not exposed to them.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/staging')
    runs-on: ubuntu-latest
    concurrency:
      group: backend-sonar-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Same ref as test, so the lcov paths and sonar.scm.revision line up.
          # Full history: the scanner blames lines and diffs against main.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # node_modules and the generated Prisma client give the TypeScript
      # analyzer type information; rules that need it are silently skipped
      # without it. Tests are not rerun here — coverage comes from the artifact.
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          # Identity from repo variables; sources, tests, exclusions and the
          # lcov path from backend/sonar-project.properties.
          # sonar.scm.revision is pinned because on PRs GITHUB_SHA is the merge
          # commit while the checkout above is the branch head.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_BACKEND_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}

  # Build first, migrate second, deploy third. Migrations are the only step here
  # that cannot be undone by re-running the pipeline, so nothing irreversible
  # happens until a deployable image already exists in Artifact Registry. A
  # broken Dockerfile then fails before the database is touched, instead of
  # leaving an environment migrated but still serving the old revision.
  #
  # main deploys production, staging deploys staging. Which services, service
  # accounts, database and secrets that means comes from the GitHub Environment
  # (migrate, deploy); build only pushes an image, the same for both. A push or a
  # manual run (workflow_dispatch) deploys; the manual run covers a branch whose
  # latest push changed no watched path.
  build:
    name: Build and push image
    needs: [test, sonar]
    # always(): sonar is skipped on staging (see above), and a skipped need would
    # otherwise skip this job too. Production still requires a passed gate.
    if: >
      always() && needs.test.result == 'success' &&
      (needs.sonar.result == 'success' ||
       (needs.sonar.result == 'skipped' && github.ref == 'refs/heads/staging')) &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that Workload Identity Federation exchanges for GCP
      # credentials. Without it, auth fails with a confusing 403.
      id-token: write
    concurrency:
      group: backend-build-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/backend
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Tagged with the SHA (what makes a rollback a one-liner against a known
      # revision) and with the branch, so `:main` is what production last built.
      - name: Build and push
        working-directory: backend
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  # Applies backend/prisma/migrations to the environment's Cloud SQL database
  # before the new revision serves. backend/Dockerfile bakes the generated Prisma
  # client into the image, so code must never reach an environment ahead of the
  # schema it expects.
  migrate:
    name: Apply migrations
    needs: [build]
    # A skipped job anywhere up the chain (sonar, on staging) skips everything after it unless
    # the condition is spelled out, so build's own result is checked directly.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-migrate-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      # postgres on the environment's database, through the Auth Proxy below:
      # postgresql://postgres:<pw>@127.0.0.1:5432/<db>?sslmode=disable. The proxy
      # encrypts and authenticates the hop to Cloud SQL itself, which accepts no
      # other connection (no authorized networks).
      MIGRATOR_DB_URL: ${{ secrets.MIGRATOR_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The Prisma CLI from the backend lockfile: the same release local dev and
      # the test job use, never a floating `latest` against a real database.
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Start the Cloud SQL Auth Proxy
        env:
          PROXY_VERSION: v2.26.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cloud-sql-proxy" \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          chmod +x "$RUNNER_TEMP/cloud-sql-proxy"
          "$RUNNER_TEMP/cloud-sql-proxy" --address 127.0.0.1 --port 5432 "${{ vars.CLOUDSQL_INSTANCE }}" \
            > "$RUNNER_TEMP/proxy.log" 2>&1 &
          for i in $(seq 1 30); do
            pg_isready -q -h 127.0.0.1 -p 5432 && exit 0
            sleep 1
          done
          echo "the proxy did not come up:"; cat "$RUNNER_TEMP/proxy.log"; exit 1

      # Roles first (idempotent), then the migrations, then the tables go to the
      # environment's app role: row level security lets only the owner through.
      - name: Apply migrations
        run: |
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 -f prisma/ops/bootstrap-roles.sql
          DATABASE_URL="$MIGRATOR_DB_URL" DIRECT_URL="$MIGRATOR_DB_URL" npx prisma migrate deploy
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 -v app_role="${{ vars.APP_DB_ROLE }}" \
            -f prisma/ops/hand-off-ownership.sql

      # The team's admin accounts on the deployed app, so they can sign in with Google. The
      # addresses live only in an environment secret (the repo is public); the SQL file holds none
      # and receives them as a psql variable, never spliced into the query. Idempotent: it only
      # adds or promotes.
      - name: Seed admin accounts
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "$ADMIN_EMAILS" ]; then
            echo "admin seed skipped: ADMIN_EMAILS is not set"
            exit 0
          fi
          psql "$MIGRATOR_DB_URL" -X -q -v ON_ERROR_STOP=1 -v emails="$ADMIN_EMAILS" \
            -f prisma/ops/seed-admins.sql

  # Rolls the already-pushed image out to the environment's Cloud Run service.
  # needs migrate, so a failed migration blocks the rollout.
  deploy:
    name: Deploy to Cloud Run
    needs: [build, migrate]
    if: always() && needs.build.result == 'success' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: backend-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/backend
      SERVICE: ${{ vars.BACKEND_SERVICE }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # The Google client id and redirect URI are not secret, so they travel as plain env from
      # environment variables; the client secret comes from Secret Manager like the DB URL. The
      # backend refuses to boot in production without all three (Google is the only way in).
      # The DB URL comes from Secret Manager, never --set-env-vars: env vars are readable in the
      # Cloud Run console and in deploy logs. It reaches Cloud SQL over the unix socket that
      # --add-cloudsql-instances mounts; DATABASE_URL and DIRECT_URL are the same URL, since
      # nothing pools in between.
      # Deployed with no traffic behind a `candidate` tag: the new revision gets
      # its own URL to be tested at while the previous revision keeps serving.
      # A brand-new service has no previous revision to protect, so its first
      # deploy takes traffic directly — the smoke test still gates the run.
      - name: Deploy candidate revision
        run: |
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            TRAFFIC="--no-traffic"
          else
            echo "first deploy of $SERVICE: no previous revision to keep serving"
            TRAFFIC=""
          fi
          gcloud run deploy "$SERVICE" $TRAFFIC --tag candidate \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --service-account "${{ vars.RUN_BACKEND_SA }}" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=${{ vars.DB_SECRET }}:latest,DIRECT_URL=${{ vars.DB_SECRET }}:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest" \
            --set-env-vars "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}" \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 --cpu-boost --concurrency 80 \
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES }}" --max-instances 3

      # Hits the candidate at its tag URL, so a broken revision is caught while
      # it has zero traffic. Retried because the candidate starts cold.
      - name: Smoke test the candidate
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
          test -n "$URL" || { echo "no candidate URL found"; exit 1; }
          echo "checking $URL/health"
          for i in 1 2 3 4 5; do
            CODE="$(curl -sS -o /tmp/smoke.out -w '%{http_code}' --max-time 30 "$URL/health" || echo 000)"
            if [ "$CODE" = "200" ]; then
              echo "healthy: $(cat /tmp/smoke.out)"
              exit 0
            fi
            echo "attempt $i: HTTP $CODE"
            sleep 5
          done
          echo "smoke test failed after 5 attempts; last body:"
          cat /tmp/smoke.out || true
          echo "candidate was never given traffic; the previous revision is still serving"
          exit 1

      # Only a candidate that passed the smoke test takes traffic. Skipped on
      # failure, so a bad revision is never promoted and nothing needs rolling back.
      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest
          echo "serving: $(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
