# SonarCloud analysis config for the backend. Read by the sonar job in
# .github/workflows/backend.yml (projectBaseDir: backend).
# sonar.organization and sonar.projectKey are passed by the workflow from the
# SONAR_ORG / SONAR_BACKEND_PROJECT_KEY repo variables; for a local run pass
# them on the command line:
#   npx sonar-scanner -Dsonar.organization=... -Dsonar.projectKey=... -Dsonar.token=...
sonar.projectName=tofly-ugc-management backend
sonar.sourceEncoding=UTF-8

# Unit specs are colocated in src/; e2e specs live in test/. The test inclusion
# patterns pull them out of sources so they are analysed as tests, not code.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Mirror coverage.exclude in vitest.config.ts so Sonar's percentage matches the
# badge and the 80% threshold.
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/prisma/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
