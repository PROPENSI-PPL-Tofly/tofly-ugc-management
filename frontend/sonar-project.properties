# SonarCloud analysis config for the frontend. Read by the sonar job in
# .github/workflows/frontend.yml (projectBaseDir: frontend).
# sonar.organization and sonar.projectKey are passed by the workflow from the
# SONAR_ORG / SONAR_FRONTEND_PROJECT_KEY repo variables; for a local run pass
# them on the command line:
#   npx sonar-scanner -Dsonar.organization=... -Dsonar.projectKey=... -Dsonar.token=...
sonar.projectName=tofly-ugc-management frontend
sonar.sourceEncoding=UTF-8

# Tests are colocated in src/ as *.test.ts(x). The test inclusion patterns pull
# them out of sources so they are analysed as tests, not code.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.d.ts

# Mirror coverage.exclude in vitest.config.ts so Sonar's percentage matches the
# badge and the 80% threshold.
sonar.coverage.exclusions=src/**/layout.tsx,src/**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
